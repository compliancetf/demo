name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [master]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: ctfkit scan
    # Public repo: pull requests from forks get no secrets and a read-only token, so they skip.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/env=compliancetf
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pre_plan reads configuration only: no init, no AWS, no registry token.
      # The registry is read from the checkout, so a pull request can edit it; CODEOWNERS owns
      # .github/ and branch protection must require a code owner review (see the file header).
      - name: ctfkit scan (pre_plan)
        uses: compliancetf/ctfkit-action@a138129e2c59f256e38440e070f88f3ac490d2dd # v0.4.0
        with:
          command: scan
          # 0.5.0 embeds only CIS v6.0 controls, so control-keyed ISO exceptions stop matching.
          version: v0.4.1
          stage: pre_plan
          chdir: infra
          exceptions: .github/ctfkit/exceptions.yaml
          pr-comment: ${{ github.event_name == 'pull_request' }}
          sarif: "false"
          fail-on: error

  plan:
    name: terraform plan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/env=compliancetf
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      # With an empty role-to-assume the AWS action falls back to the runner's own credentials.
      - name: Check AWS settings
        env:
          ROLE: ${{ vars.AWS_PLAN_ROLE_ARN }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          missing=0
          [ -n "${ROLE}" ] || { echo "::error::Variable AWS_PLAN_ROLE_ARN is not set."; missing=1; }
          [ -n "${BUCKET}" ] || { echo "::error::Variable TF_STATE_BUCKET is not set."; missing=1; }
          [ -n "${REGION}" ] || { echo "::error::Variable AWS_REGION is not set."; missing=1; }
          exit "${missing}"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: ./.github/actions/registry-auth
        with:
          token: ${{ secrets.CTF_REGISTRY_TOKEN }}

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: >-
          terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"

      # A failing plan is a demo outcome: compliance.tf variable validations name each control.
      # Keep going so the errors reach the PR comment; the last step fails the job.
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock=false -input=false -no-color -out=tfplan > plan.log 2>&1
          rc=$?
          cat plan.log
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"

      - name: Plan failure comment
        if: ${{ !cancelled() && steps.plan.outputs.rc != '0' }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/plan-comment.md"
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/@/\&#64;/g'; }
          {
            echo "<!-- terraform-plan -->"
            echo "### terraform plan failed"
            echo
            if grep -q "Control '" plan.log; then
              echo "compliance.tf blocked these inputs (control id and fix):"
              echo
              echo "<pre>"
              # Terraform wraps each message: join a "Control '<id>'" paragraph into one line.
              sed 's/^│ *//' plan.log \
                | awk '/^Control \047/ { p = 1; s = "" } p { if ($0 == "") { print s; p = 0 } else s = s (s == "" ? "" : " ") $0 } END { if (p) print s }' \
                | sort -u | head -c 20000 | esc
              echo "</pre>"
            fi
            echo "<details><summary>Show output</summary>"
            echo
            echo "<pre>"
            head -c 40000 plan.log | esc
            echo "</pre>"
            echo
            echo "</details>"
          } > "${body}"
          cat "${body}" >> "${GITHUB_STEP_SUMMARY}"
          echo "PLAN_COMMENT=${body}" >> "${GITHUB_ENV}"

      - name: terraform show
        id: show
        if: ${{ steps.plan.outputs.rc == '0' }}
        run: |
          terraform show -json tfplan > plan.json
          terraform show -no-color tfplan > plan.txt

      # Same command and chdir as the scan job, so its sticky comment would overwrite that job's.
      # Its findings go into the terraform plan comment below instead.
      - name: ctfkit scan (post_plan)
        id: scan
        if: ${{ steps.show.outcome == 'success' }}
        uses: compliancetf/ctfkit-action@a138129e2c59f256e38440e070f88f3ac490d2dd # v0.4.0
        with:
          command: scan
          # 0.5.0 embeds only CIS v6.0 controls, so control-keyed ISO exceptions stop matching.
          version: v0.4.1
          plan: infra/plan.json
          chdir: infra
          exceptions: .github/ctfkit/exceptions.yaml
          pr-comment: "false"
          sarif: "false"
          fail-on: error

      # Coverage report only; the scans decide pass or fail. Uses the latest ctfkit:
      # 0.4.1 stops on a served control its embedded catalog lacks.
      - name: ctfkit report
        if: ${{ !cancelled() && steps.show.outcome == 'success' }}
        continue-on-error: true
        uses: compliancetf/ctfkit-action@a138129e2c59f256e38440e070f88f3ac490d2dd # v0.4.0
        with:
          command: report
          path: infra
          exceptions: .github/ctfkit/exceptions.yaml
          pr-comment: ${{ github.event_name == 'pull_request' }}
          sarif: "false"
          fail-on: never

      - name: Plan summary
        if: ${{ !cancelled() && steps.show.outcome == 'success' }}
        env:
          SCAN_MD: ${{ steps.scan.outputs.markdown }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/plan-comment.md"
          read -r add change destroy < <(jq -r '
            [.resource_changes[]?.change.actions] as $a
            | [($a | map(select(index("create"))) | length),
               ($a | map(select(index("update"))) | length),
               ($a | map(select(index("delete"))) | length)] | @tsv' plan.json)
          max=50000
          size=$(wc -c < plan.txt)
          {
            echo "<!-- terraform-plan -->"
            echo "### terraform plan: ${add} to add, ${change} to change, ${destroy} to destroy"
            echo
            echo "<details><summary>Show plan</summary>"
            echo
            # Plan text holds values from the pull request: HTML-escape it inside <pre> (no @ mentions).
            echo "<pre>"
            head -c "${max}" plan.txt | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/@/\&#64;/g'
            echo "</pre>"
            if [ "${size}" -gt "${max}" ]; then
              echo
              echo "_Plan truncated at ${max} of ${size} bytes. Run \`terraform show\` locally for the rest._"
            fi
            echo
            echo "</details>"
          } > "${body}"
          # ctfkit already escaped its markdown. GitHub caps a comment at 65536 characters.
          if [ -n "${SCAN_MD}" ] && [ -f "${SCAN_MD}" ]; then
            if [ $(( $(wc -c < "${body}") + $(wc -c < "${SCAN_MD}") )) -lt 64000 ]; then
              { echo; cat "${SCAN_MD}"; } >> "${body}"
            else
              printf '\n_ctfkit post_plan findings are in the job summary._\n' >> "${body}"
            fi
          fi
          cat "${body}" >> "${GITHUB_STEP_SUMMARY}"
          echo "PLAN_COMMENT=${body}" >> "${GITHUB_ENV}"

      - name: Sticky plan comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && env.PLAN_COMMENT != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const body = fs.readFileSync(process.env.PLAN_COMMENT, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            // Only update a comment this workflow wrote; anyone can post the marker.
            const mine = comments.find((c) =>
              c.user && c.user.type === 'Bot' && c.user.login === 'github-actions[bot]' &&
              (c.body || '').startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on plan error
        if: ${{ steps.plan.outputs.rc != '0' }}
        run: |
          echo "terraform plan failed; see the PR comment or the step log." >&2
          exit 1
